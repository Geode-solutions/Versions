name: Merge PRs

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      repos:
        type: string
        required: true

jobs:
  merge-PRs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const repos = "${{ inputs.repos }}"
            const owner = 'Geode-solutions'
            const branchName = "${{ inputs.branch }}"
            const testTag = `${branchName}-tag`
            // Repositories are independent: merge them concurrently, each one in order
            const repoList = repos.split(';')
            // Head branches may already be removed by the repository "auto-delete head branches" setting
            const deleteRefIfExists = async (repo, ref) => {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref })
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) {
                  throw error
                }
                console.log(`${repo}: ${ref} already deleted`)
              }
            }
            const results = await Promise.allSettled(repoList.map(async (repo) => {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`
              })
              const branch_pr = prs.data.find(pr => pr.head.ref == branchName)
              if (!branch_pr) {
                console.log(`${repo}: no open PR`)
                return
              }
              const pull_number = branch_pr.number
              console.log(`${repo}: merging PR #${pull_number}`)
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number
                })
              } catch (error) {
                // The merge API can fail (e.g. HTTP 500) although the PR got merged
                const pr = await github.rest.pulls.get({ owner, repo, pull_number })
                if (!pr.data.merged) {
                  throw error
                }
                console.log(`${repo}: merge reported "${error.message}" but PR #${pull_number} is merged`)
              }
              console.log(`${repo}: deleting branch`)
              await deleteRefIfExists(repo, `heads/${branchName}`)
              let release
              try {
                release = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: testTag
                })
              } catch (error) {
                if (error.status !== 404) {
                  throw error
                }
                console.log(`${repo}: no test release`)
                return
              }
              console.log(`${repo}: deleting release ${release.data.name} (ID: ${release.data.id})`)
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.data.id
              })
              console.log(`${repo}: deleting tag ${testTag}`)
              await deleteRefIfExists(repo, `tags/${testTag}`)
            }))
            const failures = results
              .map((result, i) => ({ repo: repoList[i], result }))
              .filter(({ result }) => result.status === 'rejected')
            for (const { repo, result } of failures) {
              console.log(`${repo}: ${result.reason.message}`)
            }
            if (failures.length) {
              core.setFailed(`Merge failed for ${failures.map(f => f.repo).join(', ')}`)
            }
