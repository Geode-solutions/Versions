name: Validate pull requests

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      repos:
        type: string
        required: true
      workflow:
        type: string
        required: true
    outputs:
      base:
        value: ${{ jobs.validate-PRs.outputs.base }}
      repos_array:
        value: ${{ jobs.validate-PRs.outputs.repos_array }}
      repos:
        value: ${{ jobs.validate-PRs.outputs.repos }}
      repo_configs:
        value: ${{ jobs.concat-configs.outputs.repo_configs }}

jobs:
  validate-PRs:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.check.outputs.base }}
      repos: ${{ steps.check.outputs.repos }}
      repos_array: ${{ steps.check.outputs.repos_array }}
    steps:
      - uses: actions/github-script@v8
        id: check
        with:
          github-token: ${{ secrets.TOKEN }}
          result-encoding: string
          script: |
            const repos = "${{ inputs.repos }}"
            const branch = "${{ inputs.branch }}"
            const owner = 'Geode-solutions'
            const array_repos = repos.split(';')
            // Repositories are checked concurrently, then reported in order
            const validations = await Promise.all(array_repos.map(async (repo) => {
              const messages = []
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branch}`
              })
              const branch_pr = prs.data.find(pr => pr.head.ref == branch)
              if (!branch_pr) {
                return { repo, messages }
              }
              const pull_number = branch_pr.number
              // C++ PRs end with a gate job joining tests and deploy, JS and Python PRs with the deploy notification
              const [gate, notify, pr, reviews] = await Promise.all([
                github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: branch,
                  check_name: "test / gate"
                }),
                github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: branch,
                  check_name: "test / deploy-repository / notify / notify"
                }),
                github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number
                }),
                github.rest.pulls.listReviews({
                  owner,
                  repo,
                  pull_number
                })
              ])
              // The gate check only appears once the tests are done: C++ never falls back to the notification
              const check_run = "${{ inputs.workflow }}" == "cpp" ? gate.data.check_runs[0] : notify.data.check_runs[0]
              if (!check_run || check_run.status != 'completed' || check_run.conclusion != 'success') {
                messages.push('PR check not completed for ' + repo)
              }
              if (!pr.data.mergeable) {
                messages.push('PR is not mergeable for ' + repo)
              }
              let changes_requested = []
              let approved = false
              for (const review of reviews.data) {
                if (review.state == 'APPROVED') {
                  approved = true
                  changes_requested = changes_requested.filter(r => r != review.user.login)
                }
                else if (review.state == 'CHANGES_REQUESTED') {
                  changes_requested.push(review.user.login)
                }
              }
              if (changes_requested.length) {
                console.log(repo, changes_requested)
                messages.push('PR request changes for ' + repo)
              }
              if (!approved) {
                messages.push('PR not approved for ' + repo)
              }
              return { repo, base: branch_pr.base.ref, pull_number, check_run, messages }
            }))
            let result = ""
            for (const validation of validations) {
              if (validation.pull_number === undefined) {
                console.log(`${validation.repo}: no open PR`)
                continue
              }
              console.log(`${validation.repo}: PR #${validation.pull_number} into ${validation.base}, check ${validation.check_run?.status} ${validation.check_run?.conclusion}`)
              core.setOutput("base", validation.base)
              for (const message of validation.messages) {
                core.setFailed(message)
                result += message + '\n'
              }
            }
            core.setOutput("repos", repos)
            core.setOutput("repos_array", JSON.stringify(array_repos))
            return result
      - name: Post to a Slack channel
        if: failure()
        id: slack
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: C0598GTCLGH
          slack-message: "${{ inputs.branch }}: PR validation failed\n${{ steps.check.outputs.result }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  get-py-configs:
    if: ${{ inputs.workflow == 'py' }}
    needs: validate-PRs
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.validate-PRs.outputs.repos_array) }}
    uses: Geode-solutions/actions/.github/workflows/py-config.yml@master
    with:
      repo: "Geode-solutions/${{ matrix.repo }}"
      branch: ${{ inputs.branch }}
    secrets: inherit

  get-js-configs:
    if: ${{ inputs.workflow == 'js' }}
    needs: validate-PRs
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.validate-PRs.outputs.repos_array) }}
    uses: Geode-solutions/actions/.github/workflows/js-config.yml@master
    with:
      repo: "Geode-solutions/${{ matrix.repo }}"
      branch: ${{ inputs.branch }}
    secrets: inherit

  concat-configs:
    needs: [validate-PRs, get-py-configs, get-js-configs]
    if: |
      always() &&
      (inputs.workflow == 'py' || inputs.workflow == 'js') && 
      (needs.get-py-configs.result == 'success' || needs.get-py-configs.result == 'skipped') && 
      (needs.get-js-configs.result == 'success' || needs.get-js-configs.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      repo_configs: ${{ steps.result.outputs.repo_configs }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*${{ inputs.workflow }}-config"
      - name: Save data to file
        uses: actions/github-script@v8
        id: result
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const folders = fs.readdirSync('.');
            const fullConfig = [];
            for (const folder of folders) {
              const file = fs.readdirSync(folder)[0];
              console.log(file);
              const repo = file.split('-${{ inputs.workflow}}')[0];
              const data = JSON.parse(fs.readFileSync(path.join(folder, file), 'utf-8'));
              console.log(data);
              const microservices = data['microservices']
              for(const config in data) {
                console.log(config, data[config]);
                if( data[config] === true ) {
                  fullConfig.push( { repo, config, microservices } );
                }
              }
            }
            console.log(fullConfig);
            core.setOutput("repo_configs", JSON.stringify(fullConfig))
